# RoboSense Airy driver config for the Lynx S10 FRONT lidar (airy_201).
#
# Installed as <ws>/src/rslidar_sdk/config/config.yaml by scripts/install.sh.
# `__LIDAR_HOST_IP__` is replaced with LIDAR_HOST_IP (default 10.21.33.100),
# the Orin's enP8p1s0 address the Airy's multicast group must be joined on.
#
# Matches the topics/frames the Robonix primitives expect:
#   /airy_201/points  (PointCloud2, XYZIRT)
#   /airy_201/imu     (sensor_msgs/Imu)
#
# use_lidar_clock=false keeps message header stamps on the host clock, which
# FAST-LIO forwards into the odom TF; ts_first_point=true makes the per-point
# timestamps relative to the first point (fast_lio selects the header stamp
# only when head_time is ~0).
common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6691
      difop_port: 7781
      imu_port: 6681
      # The S10's Airy sends MSOP/DIFOP/IMU to this multicast group.
      # host_address must be the Orin's eno1 IP so IP_ADD_MEMBERSHIP
      # joins on the right interface (0.0.0.0 would use the default route).
      host_address: __LIDAR_HOST_IP__
      group_address: 224.10.10.201
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 60
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
      start_angle: 0
      end_angle: 360
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: /home/robosense/lidar.pcap
    ros:
      ros_frame_id: airy_201
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /airy_201/imu
      ros_send_point_cloud_topic: /airy_201/points
      ros_queue_length: 100
