manifestVersion: 1

package:
  name: robonix.primitive.deep_robotics.lynx_s10.camera
  version: 0.2.0
  vendor: robonix
  description: Lynx S10 wide-angle RGB camera primitive — RTSP pull + live rgb stream + on-demand snapshot.
  license: Apache-2.0
  tags: [primitive, camera, rgb, rtsp, deep_robotics, lynx_s10, ros2]
  maintainers:
    - ZLC(mujue) <mujue155@gmail.com>

capability_id: lynx_camera

build: bash scripts/build.sh
start: bash scripts/start.sh

# Built-in contracts (under <robonix>/capabilities/primitive/camera/).
capabilities:
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/snapshot
