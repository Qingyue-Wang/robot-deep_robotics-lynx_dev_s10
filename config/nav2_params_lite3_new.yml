planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Theta* is an any-angle planner: its output is a chain of long STRAIGHT
      # segments (line-of-sight shortcuts) instead of a grid staircase. That is
      # what "先转后直" needs: a fixed straight line the controller can align to
      # by rotating in place, then drive without steering.
      #
      # Do NOT go back to SmacPlanner2D + its smoother here. The smoother pulls
      # the path's start tangent onto the robot's current heading (that is what
      # w_smooth does), i.e. it re-shapes the plan into an arc starting at the
      # robot. The controller then has no straight line to rotate onto and just
      # follows the arc, which reads as "边走边转" no matter how DWB is tuned.
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      # 8-connected expansion; with line-of-sight shortcuts this keeps segments
      # straight rather than axis-aligned.
      how_many_corners: 8
      # Keep distance dominant (1.0) so the path stays the shortest straight
      # line, while traversal cost (2.0) still pulls it away from wall inflation.
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      # The global costmap carries the mapped static layer, so unknown cells are
      # genuinely unknown: never plan through them.
      allow_unknown: false
      # Do not bend the path near the goal to line up with the goal yaw; the
      # requested arrival yaw is handled by a clean in-place rotation, not by a
      # curved final approach.
      use_final_approach_orientation: false
    # MID-360 ICP odometry and projected scans are processed asynchronously and
    # currently arrive about 0.4-0.5 s behind wall time. Keep enough TF history
    # for costmap message filters to resolve the scan timestamp reliably.
    tf_buffer_duration: 10.0


controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    tf_buffer_duration: 10.0
    # A 5 Hz command loop lets the robot travel about 8 cm between decisions at
    # 0.4 m/s.  Use a faster loop and a lower navigation speed while the
    # projected MID-360 scan still has measurable pipeline latency.
    controller_frequency: 10.0
    # min_x_velocity_threshold: 0.01
    # min_y_velocity_threshold: 0.01
    # min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      # This checker only measures TRANSLATION (hypot of dx/dy). The final
      # in-place pivot to the goal yaw moves the base by ~0, so a worst-case
      # pi-rad turn at the measured ~0.32 rad/s response (see deadband note at
      # velocity_smoother) needs ~10 s and would trip a 10 s allowance right
      # as the robot is finishing. 20 s still catches a controller that only
      # steps in place at a doorway.
      movement_time_allowance: 20.0
    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      # Arrival heading IS checked now: stop inside the 0.25 m circle, then
      # pivot in place to the goal yaw (RotateToGoal critic below). With
      # stateful=true the xy check latches the first time it passes, so the
      # robot can turn on the spot without the xy check failing again.
      # 0.20 rad (~11 deg) is a compromise: the chassis cannot use angular
      # commands below the 0.22 rad/s smoother deadband, so a tolerance much
      # tighter than this cannot be settled reliably. Tighten to 0.10 only
      # after confirming the pivot converges in a real run.
      yaw_goal_tolerance: 0.20
      # Keep stateful=true: latch xy tolerance, then only check yaw.
      stateful: true
    # Turn-in-place shim in front of DWB (the "先转后直" half of this profile):
    # it compares the robot heading with the heading of a NEWLY received path
    # and pivots before handing off, so the dog then rolls the leg straight
    # instead of steering while moving (every steering correction is a leg lift).
    #
    # The 2026-11-10 17:52 run looked like a shim failure — 85 s of pure-yaw
    # commands (linear=0, angular≈0.43 rad/s) with odom yaw frozen at -0.058 rad
    # — but the cause was the robot's 使用模式 being 常规模式 instead of 导航模式:
    # in 常规模式 the chassis drops every /NAV_CMD (linear AND angular), so the
    # command never reached the legs. See s10-usage-mode-required in the project
    # notes. In 导航模式 an in-place pivot works (verified in the 20261110-145808
    # and 20261110-160245 runs).
    #
    # Both thresholds matter:
    #   angular_dist_threshold      = heading error that triggers the in-place
    #                                 rotation. Keep it wide (~17 deg) so small
    #                                 corrections stay with DWB and only a real
    #                                 misalignment becomes a deliberate pivot.
    #   angular_disengage_threshold = error at which DWB takes over again. This
    #                                 chassis cannot stop a stepping rotation
    #                                 precisely, so settling below 3.4 deg (0.06)
    #                                 just makes the shim retry the pivot. ~7 deg
    #                                 (0.12) is also where DWB's steering command
    #                                 stays under velocity_smoother's angular
    #                                 deadband, so it will not start micro-steering
    #                                 right after the hand-off.
    #
    # Limitation of the stock shim: it re-checks only when a new path arrives.
    # With the event-driven BT (navigate_new.xml) that means the clean in-place
    # turn happens at the start of each path / replan; a corner in the middle of
    # one Theta* path is still tracked by DWB. Keep the path itself straight
    # (Theta* above) rather than expecting the shim to fix a curved plan.
    # DWB parameters
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.30
      angular_disengage_threshold: 0.12
      forward_sampling_distance: 0.45
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 1.0
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Doorways need enough time for the quadruped to settle and for the
      # controller to react to a newly observed post. Keep navigation slower
      # than open-loop manual motion while validating clearance.
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 0.6
      # min_vel_theta: 0.05
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.05
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      # 20 x 120 trajectories over a 3 s horizon repeatedly missed the 10 Hz
      # control deadline on Jetson during mapping. Forty angular samples still
      # provide 0.03 rad/s resolution while cutting DWB work substantially.
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      # NOTE: no xy_goal_tolerance / yaw_goal_tolerance / stateful here — DWB
      # (libdwb_core) does not declare them; the arrival tolerances live in
      # general_goal_checker above and the RotateToGoal critic below.
      # trans_stopped_velocity: 0.15
      short_circuit_trajectory_evaluation: True
      # RotateToGoal must be FIRST: inside its xy window it makes translation
      # cost prohibitive and turns the last leg into an in-place pivot, which is
      # exactly the requested "drive to the position, then rotate on the spot".
      # Everywhere else it scores 0 and has no effect on the straight run.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Keep obstacle cost meaningful without making every trajectory through a
      # narrow doorway too expensive. Global inflation already biases the plan
      # toward the doorway center; this critic only refines the local trajectory.
      BaseObstacle.scale: 0.02
      # Straight-line tracking. PathAlign is the heading-vs-path critic; at 0.1
      # it was five times weaker than PathDist, so the robot cut corners and
      # approached the path diagonally — an S-curve even on a straight plan.
      # Keep Nav2's default 1:1 balance (PathAlign 1.0 / PathDist 0.8) so DWB
      # holds the straight line between rotations instead of steering along it.
      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.3
      PathAlign.forward_preference: true
      # GoalAlign would steer toward the goal yaw WHILE still driving, i.e. it
      # curves the approach and every curve is a leg-lift. Keep it at 0 and let
      # RotateToGoal do the arrival yaw as one deliberate pivot once the robot
      # has reached the position.
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.1
      GoalAlign.forward_preference: true
      # PathDist keeps the trajectory on the line; keep it above GoalDist so the
      # controller cannot shortcut toward the goal.
      PathDist.scale: 0.8
      GoalDist.scale: 0.5
      # RotateToGoal window: begin pivoting as soon as the robot is inside the
      # goal-checker xy circle (0.25 m). Verified in the installed Humble
      # libdwb_critics (strings: .xy_goal_tolerance, .slowing_factor,
      # .lookahead_time); this build does NOT declare a yaw tolerance key, the
      # arrival yaw comes from general_goal_checker above.
      RotateToGoal.xy_goal_tolerance: 0.25
      # scale is the generic DWB critic weight (raw score x scale, lower is
      # better). 32 is what Nav2's own example params use (nav2_bringup
      # nav2_params.yaml) so that inside the window this critic outweighs
      # PathAlign/PathDist/GoalDist completely.
      RotateToGoal.scale: 32.0
      # Phase-2 brake term: while still entering the window at speed the score
      # adds (linear speed)^2 * slowing_factor, so a larger value stops the
      # chassis sooner instead of carrying 0.35 m/s through the goal circle.
      RotateToGoal.slowing_factor: 5.0
      # IMPORTANT for this chassis: DO NOT use the example value -1 here.
      # With -1 the critic scores the trajectory's LAST pose (sim_time = 2 s),
      # so for a 0.4 rad residual yaw error it wants ~0.2 rad/s — below the
      # 0.22 rad/s velocity_smoother deadband. The command gets zeroed and the
      # robot freezes short of the tolerance. With a positive lookahead the
      # critic scores the pose projected only 0.5 s ahead, so anywhere outside
      # the 0.20 rad tolerance the chosen |w| is ~error/0.5 >= 0.4 rad/s,
      # always above the deadband.
      RotateToGoal.lookahead_time: 0.5


# The guarded navigation launch starts 7 lifecycle nodes (controller/smoother/
# planner/behavior/bt_navigator/waypoint_follower/velocity_smoother). These
# three sections were missing, so those nodes fell back to built-in defaults
# and the lifecycle bring-up could stall. Values mirror the wrapper's own
# nav2_params_sim.yml (the only in-repo config with the full 7-node set).
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    # 0.1 s 在 TF 落后时会直接让 spin/backup/wait 抛 extrapolation；与 DWB
    # critic 段保持一致用 0.3（0.5 会让 behavior 用过期位姿转太多）。
    transform_tolerance: 0.3
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


# The navigation launch always inserts nav2_velocity_smoother between DWB and
# the final /cmd_vel guard.  Keep a second, explicit limit here so no controller
# or behavior can bypass the Lite3 navigation speed envelope accidentally.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.60]
    min_velocity: [-0.35, 0.0, -0.60]
    max_accel: [0.50, 0.0, 1.0]
    max_decel: [-0.50, 0.0, -1.0]
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    odom_duration: 0.1
    # Zero out micro-commands. The angular threshold is the most important
    # number in this file for a wheeled quadruped, because the chassis has a
    # steering-authority floor: measured on the 2026-11-11 10:14 tea-area run
    # (/cmd_vel vs measured odom yaw rate, per commanded-omega bucket):
    #
    #   commanded |ω|      measured |ω|     response
    #   0.11 - 0.16        0.039          28 %
    #   0.16 - 0.22        0.046          25 %
    #   0.22 - 0.35        0.181          63 %
    #   0.35 - 0.60        0.316          76 %
    #
    # Below ~0.22 rad/s the robot does not rotate — it just keeps stepping
    # (那就是"一边向前走一边抬腿") and DWB keeps re-issuing the same futile
    # correction for the whole leg. 0.12 let that band through; 0.22 zeros it,
    # so the wheels roll dead straight and real corrections come from the
    # rotation shim above (0.45 rad/s, 76 % response) as a deliberate pivot.
    # Cost: small path offsets are no longer chased at all during a straight
    # leg (0.40 m max in that run, recovering to 0.10 m by the goal).
    deadband_velocity: [0.02, 0.0, 0.22]
    # Fail to zero promptly if the controller stops publishing.  This is not a
    # substitute for a geometric collision monitor, but prevents stale motion.
    velocity_timeout: 0.5


bt_navigator:
  ros__parameters:
    use_sim_time: false
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    # navigation2 1.1.x (Humble) selects the behavior tree with
    # default_nav_to_pose_bt_xml. `default_bt_xml_filename` is the old
    # Foxy/Galactic name: it is still accepted as a parameter but never read,
    # so the stack silently loaded the stock
    # navigate_to_pose_w_replanning_and_recovery.xml and this file's
    # "事件驱动" BT was never executed. Verify after boot with:
    #   ros2 param get /bt_navigator default_nav_to_pose_bt_xml
    default_nav_to_pose_bt_xml: "__ROBONIX_BT_XML__"
    # The default 10 ms loop repeatedly exceeded its 100 Hz deadline in the
    # navigation logs. 20 Hz is sufficient for BT coordination; the local
    # controller continues running independently at 10 Hz.
    bt_loop_duration: 50
    # Allow Zenoh action/service handshakes up to one second under load.
    default_server_timeout: 1000
    tf_buffer_duration: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      # Match the legacy Lite3 deployment so RViz receives the rolling map
      # continuously instead of relying on sparse full-map publications.
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Lite3 body envelope; padding supplies clearance for small pose/control errors.
      # Effective envelope with padding: 0.71 m long x 0.47 m wide.
      # Doorway centering is handled by inflation costs instead of an oversized body.
      footprint: "[ [0.305, 0.185], [0.305, -0.185], [-0.305, -0.185], [-0.305, 0.185] ]"
      footprint_padding: 0.05
      # robot_radius: 0.32

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # MID-360 supplies the full-surround scan; the front RGB-D camera fills
        # its near-field blind area for low obstacles. Keep the depth cloud out
        # of the global costmap and RTAB-Map occupancy-grid generation so it
        # cannot create persistent duplicate walls.
        observation_sources: scan depth_cloud
        scan:
          topic: /scanner/scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          tf_filter_tolerance: 1.0
          inf_is_valid: true
          # Leave observation_persistence and expected_update_rate at the Nav2
          # defaults, matching the legacy Lite3 deployment: use the latest scan
          # without accumulating stale obstacle observations.
          marking: true
          clearing: true
        depth_cloud:
          # With depth_registration enabled, the Orbbec driver publishes the
          # geometry-aligned cloud on this topic.
          topic: /camera/depth_registered/points
          data_type: "PointCloud2"
          # base_link is at the torso centre and the feet/floor are roughly
          # 0.3 m below it. This accepts obstacle returns down to about 10 cm
          # above the floor while rejecting the floor itself.
          min_obstacle_height: -0.20
          max_obstacle_height: 1.50
          obstacle_min_range: 0.15
          obstacle_max_range: 2.50
          raytrace_min_range: 0.15
          raytrace_max_range: 3.00
          tf_filter_tolerance: 0.5
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Keep a wider, slower-decaying preference field around door posts.
        # This does not enlarge the lethal footprint, so a genuinely passable
        # doorway remains available when no roomier trajectory exists.
        inflation_radius: 0.55
        cost_scaling_factor: 2.5


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      # robot_radius: 0.32
      footprint: "[ [0.305, 0.185], [0.305, -0.185], [-0.305, -0.185], [-0.305, 0.185] ]"
      footprint_padding: 0.05
      update_frequency: 1.0      # 更新频率（Hz），比 local_costmap 低即可
      publish_frequency: 1.0     # 发布频率
      resolution: 0.05

      # The deployment runs rtabmap in localization mode and rtabmap publishes
      # /map (transient-local), so plan on the real static map instead of the
      # rolling 24 m "outdoor, no prior map" profile this file used to carry.
      # Without the static layer, Theta* cannot plan through/around mapped walls
      # outside the live 6 m scan and its straight segments stop being
      # trustworthy; allow_unknown is therefore false again as well.
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scanner/scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          tf_filter_tolerance: 1.0
          inf_is_valid: true
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Bias the global plan toward the center of doorways and corridors.
        # This is intentionally below the old Lite3 value (2.0 m) for narrow rooms.
        inflation_radius: 0.9
        cost_scaling_factor: 2.5


lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
