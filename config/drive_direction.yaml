# Drive-direction governor (scripts/drive_direction.py).
#
# The robot heading is compared with the planned path at lookahead_m. Within
# the forward band DWB may only sample positive linear velocity; beyond the
# reverse band it may only sample negative linear velocity. The two bands
# overlap intentionally: 80..100 degrees keeps the previous mode so a wheeled
# quadruped does not chatter between forward and reverse at the 90-degree
# boundary.
#
# These are DWB dynamic parameters, written through
# /controller_server/set_parameters:
#   FollowPath.min_vel_x / FollowPath.max_vel_x
# The static nav2_params_lite3_new.yml keeps min_vel_x=0.0 / max_vel_x=0.35,
# so a crashed governor leaves the controller forward-only (fail-safe), and a
# node restart starts in forward again.

plan_topic: /plan
controller_node: /controller_server
controller_plugin: FollowPath
base_frame: base_link

# Distance along the path used to measure the angle. Match the shim's
# forward_sampling_distance (0.25 m) so the forward/reverse mode and the
# shim's own heading error are measured at the same point.
lookahead_m: 0.25
# Hysteresis around the requested 90-degree rule.
reverse_enter_deg: 100.0
forward_enter_deg: 80.0
# Ignore a path whose remaining target is this close; RotateToGoal owns it.
min_target_m: 0.15

# DWB velocity ranges (m/s).
# Forward and reverse use the same magnitude and the same acceleration,
# angular limits, critics, path and final RotateToGoal. Only the sign of the
# linear velocity range changes; this is the "same logic, backwards" mode.
# Lower reverse_min_vel_x if the robot backs up faster than desired.
forward_min_vel_x: 0.0
forward_max_vel_x: 0.35
reverse_min_vel_x: -0.35
reverse_max_vel_x: 0.0

# RotationShimController angular_dist_threshold. Forward keeps the original
# "rotate in place first" behaviour above 0.30 rad. Reverse raises it above
# pi so the shim never turns the robot around; it hands the path to DWB and
# the reverse velocity range above backs the robot along the same plan.
forward_angular_dist_threshold: 0.30
reverse_angular_dist_threshold: 3.15

rate_hz: 10.0
# No fresh /plan for this long -> return to forward-only (only when no
# navigation goal is active; at the goal the direction is held).
plan_timeout_s: 10.0

# Minimum time between forward/reverse mode changes. The direction is also
# evaluated only when a new /plan arrives, so the 10 Hz tick cannot make the
# mode flap around the 90-degree boundary while the shim rotates the robot.
mode_hold_s: 3.0

# Within this distance to the plan's last pose the RotationShimController is
# forced off (threshold > pi) so DWB's RotateToGoal is the only thing rotating
# the robot to the goal yaw. Without this the shim and RotateToGoal can fight
# and the robot spins on the spot at the goal.
near_goal_m: 0.35

# Goal lifecycle used to keep the direction while /plan is stale at the goal.
goal_status_topic: /navigate_to_pose/_action/status
